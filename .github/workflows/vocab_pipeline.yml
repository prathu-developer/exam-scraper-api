name: Daily 4-Stage Vocab Pipeline

on:
  schedule:
    - cron: '0 5 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 readability-lxml google-genai

      - name: Run 4-Stage Pipeline
        env:
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python generate_vocab.py

      - name: Save questions.json back to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add questions.json vocab_audit_log.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Generated new 25-question vocab quiz"
          git push
