name: Daily Comprehension Tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 readability-lxml google-genai

      - name: Run Comprehension Generator
        env:
          # Changed to match the keys the new script expects
          GEMINI_KEY_4: ${{ secrets.GEMINI_KEY_4 }}
          GEMINI_KEY_5: ${{ secrets.GEMINI_KEY_5 }}
          GEMINI_KEY_6: ${{ secrets.GEMINI_KEY_6 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          python generate_comprehension.py

      - name: Save files back to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Only attempt to commit if the JSON file was actually created
          if [ -f comprehension_tests.json ]; then
            git add comprehension_tests.json comprehension_audit_log.txt
            git diff --quiet && git diff --staged --quiet || git commit -m "Updated daily comprehension and usage tests"
            git pull origin main --rebase
            git push
          else
            echo "No tests generated today. Skipping git commit."
          fi

      # ✨ Telegram notification tailored for this specific script
      - name: Send Telegram Success Notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "'"$ADMIN_CHAT_ID"'",
            "text": "📖 **COMPREHENSION TESTS SUCCESSFULLY GENERATED & PUSHED!**\n\n✅ Today'\''s scheduled sets (RC / Cloze / Para Jumbles / Word Usage) are officially saved in GitHub.\n\n🔗 [View comprehension_tests.json](https://github.com/prathu-developer/exam-scraper-api/blob/main/comprehension_tests.json)",
            "parse_mode": "Markdown",
            "disable_web_page_preview": true
          }'
