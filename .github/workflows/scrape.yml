name: Daily Exam Scraper

# This tells GitHub to run the script automatically every day at 02:00 UTC
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: # This allows you to click a button to run it manually

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add exams.json
          
          # Only commit if the JSON file actually changed (avoids empty spam commits)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: Latest exam dates" && git push)
