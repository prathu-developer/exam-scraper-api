name: Daily Editorial Scraper

on:
  schedule:
    # Runs automatically at 08:30 UTC every day (Exactly 2:00 PM IST)
    - cron: '0 6 * * *'
  workflow_dispatch: # This adds a manual "Run" button for us to test it!

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Web Scraping Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python scrape_editorials.py

      - name: Save file back to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add editorials.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Updated daily full-text editorials"
          git push
