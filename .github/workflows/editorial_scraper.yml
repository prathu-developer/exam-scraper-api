name: Daily Editorial Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Web Scraping Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 readability-lxml google-genai

      - name: Run Scraper and Generate Grammar
        env:
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          python scrape_editorials.py
          python generate_grammar.py

      - name: Save files back to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add editorials.json grammar.json grammar_audit_log.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Updated daily editorials and grammar questions"
          git pull origin main --rebase
          git push

      # ✨ NEW: This ONLY runs if the git push above succeeds!
      - name: Send Telegram Success Notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "'"$ADMIN_CHAT_ID"'",
            "text": "📝 **GRAMMAR DRAFTS SUCCESSFULLY GENERATED & PUSHED!**\n\n✅ The new practice sets are officially saved in GitHub and ready to be dispatched.\n\n🔗 [View grammar.json](https://github.com/prathu-developer/exam-scraper-api/blob/main/grammar.json)",
            "parse_mode": "Markdown",
            "disable_web_page_preview": true
          }'
